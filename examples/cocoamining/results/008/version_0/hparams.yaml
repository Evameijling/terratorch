model: null
loss: ce
aux_heads: null
aux_loss: null
class_weights: null
ignore_index: -1
lr: 0.001
optimizer: AdamW
optimizer_hparams:
  weight_decay: 0.05
scheduler: null
scheduler_hparams: null
freeze_backbone: true
freeze_decoder: false
freeze_head: false
plot_on_val: 10
