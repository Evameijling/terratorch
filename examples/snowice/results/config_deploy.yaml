data:
  class_path: terratorch.datamodules.SnowMapNonGeoDataModule
  init_args:
    bands:
    - S1_reflectance_an
    - S2_reflectance_an
    - S3_reflectance_an
    - S5_reflectance_an
    - S6_reflectance_an
    batch_size: 8
    constant_scale: 1.0
    data_root: /home/egm/Data/Projects/FMs/CrossComparison/data/snow_monitoring
    drop_last: true
    means:
    - 0.3376
    - 0.337
    - 0.4052
    - 0.1829
    - 0.136
    no_data_replace: median
    no_label_replace: 255
    num_workers: 4
    stds:
    - 0.1604
    - 0.1718
    - 0.1745
    - 0.1009
    - 0.0807
    test_transform:
    - class_path: albumentations.CenterCrop
      init_args:
        height: 144
        p: 1.0
        width: 144
    - class_path: albumentations.pytorch.ToTensorV2
      init_args:
        p: 1.0
        transpose_mask: false
    train_transform:
    - class_path: albumentations.CropNonEmptyMaskIfExists
      init_args:
        height: 144
        ignore_values:
        - 255
        p: 1.0
        width: 144
    - class_path: albumentations.pytorch.ToTensorV2
      init_args:
        p: 1.0
        transpose_mask: false
    use_metadata: false
    val_transform:
    - class_path: albumentations.CenterCrop
      init_args:
        height: 144
        p: 1.0
        width: 144
    - class_path: albumentations.pytorch.ToTensorV2
      init_args:
        p: 1.0
        transpose_mask: false
deploy_config_file: true
model:
  class_path: terratorch.tasks.PixelwiseRegressionTask
  init_args:
    freeze_backbone: true
    freeze_decoder: false
    freeze_head: false
    ignore_index: 255
    loss: mae
    lr: 0.001
    model_args:
      backbone: terramind_v1_tiny
      backbone_bands:
        S2L1C_SLSTR:
        - GREEN
        - RED
        - NIR_NARROW
        - SWIR_1
        - SWIR_2
      backbone_modalities:
      - S2L1C_SLSTR
      backbone_pretrained: false
      decoder: FCNDecoder
      decoder_channels: 256
      decoder_num_convs: 4
      head_channel_list:
      - 256
      head_dropout: 0.1
      necks:
      - indices:
        - 2
        - 5
        - 8
        - 11
        name: SelectIndices
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
    model_factory: EncoderDecoderFactory
    plot_on_val: 1
    tiled_inference_on_testing: false
    tiled_inference_on_validation: false
out_dtype: int16
seed_everything: 0
trainer:
  accelerator: gpu
  accumulate_grad_batches: 2
  barebones: false
  check_val_every_n_epoch: 1
  detect_anomaly: false
  devices: auto
  enable_checkpointing: true
  fast_dev_run: false
  inference_mode: true
  log_every_n_steps: 1
  logger: false
  max_epochs: 200
  max_steps: -1
  num_nodes: 1
  overfit_batches: 0.0
  precision: 16-mixed
  reload_dataloaders_every_n_epochs: 0
  strategy: ddp_find_unused_parameters_true
  sync_batchnorm: false
  use_distributed_sampler: true
