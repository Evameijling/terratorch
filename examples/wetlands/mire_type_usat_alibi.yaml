# lightning.pytorch==2.1.1
seed_everything: 0
trainer:
  accelerator: gpu
  strategy: ddp_find_unused_parameters_true
  devices: auto
  num_nodes: 1
  precision: 16-mixed
  #logger: True # will use tensorboardlogger
  logger:
    class_path: WandbLogger
    init_args:
      name: mire_S2_terramind_tiny
      project: terratorch
      save_dir: /home/egm/Data/Projects/FMs/CrossComparison/terratorch/examples/wetlands/results
  callbacks:
    - class_path: RichProgressBar
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: EarlyStopping # TODO: or monitory learning rate? # TODO: repeat for all configs
      init_args:
        monitor: val/loss
        patience: 50
        mode: min
        check_finite: false
        verbose: true
        
  max_epochs: 200
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 2
  log_every_n_steps: 1
  enable_checkpointing: true
  default_root_dir: /home/egm/Data/Projects/FMs/CrossComparison/terratorch/examples/wetlands/results
data:
  class_path: terratorch.datamodules.MireMapNonGeoDataModule
  init_args:
    batch_size: 8
    num_workers: 2
    bands:
      - RED
      - GREEN
      - BLUE
      - NIR_BROAD
      - RED_EDGE_1
      - RED_EDGE_2
      - RED_EDGE_3
      - NIR_NARROW 
      - SWIR_1
      - SWIR_2
      # - COASTAL_AEROSOL
      # - WATER_VAPOR
    train_transform:
      - class_path: albumentations.CropNonEmptyMaskIfExists #RandomCrop
        init_args:
          height: 144
          width: 144
          p: 1.0
          ignore_values: [255]
      - class_path: ToTensorV2
    val_transform:
      - class_path: albumentations.CropNonEmptyMaskIfExists #RandomCrop
        init_args:
          height: 144
          width: 144
          p: 1.0
          ignore_values: [255]
      - class_path: ToTensorV2
    # data_root: /local_4tb/fm4cs/wetland/nibio_mire_type_crop_1024
    data_root: /home/egm/Data/Projects/FMs/CrossComparison/data/wetland_mapping/crops_1024_v2
    no_label_replace: 255
    no_data_replace: "median"
    means:
